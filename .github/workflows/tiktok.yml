name: TikTok Shorts Auto-Uploader

on:
  workflow_dispatch: 

jobs:
  upload-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Deno v2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade --pre yt-dlp yt-dlp-ejs
          pip install tiktok-uploader
          playwright install chromium

      - name: Setup Cookies
        env:
          TIKTOK_COOKIES: ${{ secrets.TIKTOK_COOKIES }}
        run: |
          echo "$TIKTOK_COOKIES" > cookies.txt

      - name: Run Auto Uploader
        run: python main.py

      - name: Commit and Push History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.txt
          git commit -m "Update uploaded videos history" || echo "No changes to commit"
          git push
